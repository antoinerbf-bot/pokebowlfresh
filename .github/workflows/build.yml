name: Build and publish O2Switch artifact
# O2Switch deployment pipeline

on:
  push:
    branches:
      - o2switch-clean
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish build artifact
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .output
          if git diff --cached --quiet; then
            echo "No build changes to publish."
            exit 0
          fi
          git commit -m "chore: publish O2Switch build [skip ci]"
          git push

      # Configure these repository secrets to enable the real server deployment:
      # O2SWITCH_HOST, O2SWITCH_USERNAME, O2SWITCH_PASSWORD, O2SWITCH_SERVER_DIR.
      - name: Deploy .output to O2Switch
        if: github.event_name == 'push'
        env:
          O2SWITCH_HOST: ${{ secrets.O2SWITCH_HOST }}
          O2SWITCH_USERNAME: ${{ secrets.O2SWITCH_USERNAME }}
          O2SWITCH_PASSWORD: ${{ secrets.O2SWITCH_PASSWORD }}
          O2SWITCH_SERVER_DIR: ${{ secrets.O2SWITCH_SERVER_DIR }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USERNAME }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          server-dir: ${{ secrets.O2SWITCH_SERVER_DIR }}
          local-dir: ./.output/
          protocol: ftps
          port: 21
          dangerous-clean-slate: false
