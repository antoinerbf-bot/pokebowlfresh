name: Build and publish O2Switch artifact
# O2Switch deployment pipeline

on:
  push:
    branches:
      - o2switch-clean
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: o2switch-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish build artifact
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .output
          if git diff --cached --quiet; then
            echo "No build changes to publish."
            exit 0
          fi
          git commit -m "chore: publish O2Switch build [skip ci]"
          # Fail visibly if a concurrent publish causes a conflict; never report a successful deployment with a stale .output bundle.
          git fetch origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${GITHUB_REF_NAME}")" ]; then
            echo "Branch advanced during build; refusing to publish stale .output."
            exit 1
          fi
          git push origin HEAD:"${GITHUB_REF_NAME}"
