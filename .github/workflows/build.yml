name: Build and publish O2Switch artifact
# O2Switch deployment pipeline

on:
  push:
    branches:
      - o2switch-clean
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: o2switch-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # Pin the runner to avoid the moving ubuntu-latest image during migration.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish build artifact
        if: github.event_name == 'push'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retry publication if another build only updated the generated .output directory.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"

            # Never publish a build if application source changed after this run started.
            if ! git diff --quiet "${GITHUB_SHA}" "origin/${GITHUB_REF_NAME}" -- . ':(exclude).output/**'; then
              echo "Application source changed during build; refusing to publish a stale artifact."
              exit 1
            fi

            # Rebase the generated artifact commit onto the latest branch without rebasing files.
            git reset --mixed "origin/${GITHUB_REF_NAME}"
            git add -f .output
            if git diff --cached --quiet; then
              echo "No build changes to publish."
              exit 0
            fi

            git commit -m "chore: publish O2Switch build [skip ci]"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "Build artifact published successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying against the latest branch."
          done

          echo "Could not publish build artifact after 3 attempts."
          exit 1
