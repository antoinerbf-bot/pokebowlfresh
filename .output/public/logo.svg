<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" width="380" height="96" fill="none">
  <!-- Matte black pill background with subtle glow and border -->
  <rect width="380" height="96" rx="22" fill="#10251F"/>
  <rect x="1" y="1" width="378" height="94" rx="21" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
  
  <!-- Text POKE -->
  <text x="88" y="49" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="4">POKE</text>
  
  <!-- Circled N -->
  <circle cx="190" cy="40" r="20" stroke="#FFFFFF" stroke-width="3" fill="#10251F"/>
  <text x="190" y="48" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900">N</text>
  
  <!-- Text BOWL -->
  <text x="292" y="49" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="4">BOWL</text>
  
  <!-- Centered Subtitle SUR MESURE -->
  <text x="190" y="78" text-anchor="middle" fill="#D7FF45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="6">SUR MESURE</text>
</svg>
