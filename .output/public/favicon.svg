<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A332B"/>
      <stop offset="100%" stop-color="#0E211A"/>
    </radialGradient>
    <linearGradient id="salmonG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF755E"/>
      <stop offset="100%" stop-color="#E53535"/>
    </linearGradient>
    <linearGradient id="avoG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="mangoG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="bowlG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E2D8"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond squircle sombre mat -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow1)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" fill="none"/>

  <!-- Baguettes en bambou traversant en diagonale -->
  <line x1="8" y1="12" x2="56" y2="52" stroke="#8D5B2E" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="14" y1="7" x2="59" y2="44" stroke="#A7723D" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Bol blanc céramique -->
  <circle cx="32" cy="32" r="23" fill="url(#bowlG1)" filter="url(#shadow1)"/>
  <circle cx="32" cy="32" r="20" fill="#FAF8F5"/>

  <!-- Quartier 1 : Saumon frais mariné (Haut-Droit) -->
  <path d="M 32 32 L 32 12 A 20 20 0 0 1 52 32 Z" fill="url(#salmonG1)"/>
  <path d="M 35 15 Q 41 22 47 28" stroke="#FFE7E1" stroke-width="1.2" fill="none" opacity="0.85"/>
  <path d="M 34 22 Q 39 27 44 32" stroke="#FFE7E1" stroke-width="1.2" fill="none" opacity="0.85"/>
  <rect x="41" y="17" width="5" height="5" rx="1" fill="#FF8E79"/>
  <rect x="36" y="23" width="4.5" height="4.5" rx="1" fill="#FF6B52"/>

  <!-- Quartier 2 : Avocat émincé en éventail (Haut-Gauche) -->
  <path d="M 32 32 L 12 32 A 20 20 0 0 1 32 12 Z" fill="#15803D"/>
  <path d="M 32 32 L 14 27 A 20 20 0 0 1 27 14 Z" fill="url(#avoG1)"/>
  <path d="M 32 32 L 18 22 A 20 20 0 0 1 22 18 Z" fill="#BBF7D0"/>
  <path d="M 32 32 L 23 18 A 20 20 0 0 1 28 15 Z" fill="#DCFCE7"/>

  <!-- Quartier 3 : Mangue mûre en dés (Bas-Gauche) -->
  <path d="M 32 32 L 12 32 A 20 20 0 0 0 32 52 Z" fill="url(#mangoG1)"/>
  <rect x="17" y="36" width="5.5" height="5.5" rx="1.2" fill="#FEF08A"/>
  <rect x="23" y="41" width="5.5" height="5.5" rx="1.2" fill="#F59E0B"/>
  <rect x="18" y="43" width="4" height="4" rx="1" fill="#FDE047"/>

  <!-- Quartier 4 : Edamames & Algues Wakamé (Bas-Droit) -->
  <path d="M 32 32 L 32 52 A 20 20 0 0 0 52 32 Z" fill="#14532D"/>
  <circle cx="39" cy="42" r="3.2" fill="#4ADE80"/>
  <circle cx="45" cy="37" r="3" fill="#22C55E"/>
  <circle cx="36" cy="36" r="2.8" fill="#86EFAC"/>
  <circle cx="43" cy="44" r="2.5" fill="#15803D"/>

  <!-- Centre : Graines de sésame noir & blanc -->
  <circle cx="32" cy="32" r="3" fill="#0F172A"/>
  <circle cx="29" cy="31" r="0.8" fill="#FFFFFF"/>
  <circle cx="35" cy="31" r="0.8" fill="#000000"/>
  <circle cx="31" cy="34" r="0.8" fill="#FFFFFF"/>
  <circle cx="33" cy="35" r="0.8" fill="#000000"/>
</svg>
