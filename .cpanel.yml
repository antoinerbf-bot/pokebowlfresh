---
deployment:
  tasks:
    - export DEPLOYPATH=/home/puzo3938/pokenbowl.be/
    - export NODEENV=/home/puzo3938/nodevenv/pokenbowl.be/22
    - export NPM=$NODEENV/bin/npm
    - export NODE_OPTIONS=--max-old-space-size=1024
    - /bin/mkdir -p $DEPLOYPATH
    - /usr/bin/find $DEPLOYPATH -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec /bin/rm -rf {} +
    - /bin/cp -R src $DEPLOYPATH
    - /bin/cp -R public $DEPLOYPATH
    - /bin/cp package.json $DEPLOYPATH
    - /bin/cp package-lock.json $DEPLOYPATH
    - /bin/cp vite.config.ts $DEPLOYPATH
    - /bin/cp tsconfig.json $DEPLOYPATH
    - /bin/cp server.js $DEPLOYPATH
    - cd $DEPLOYPATH && $NPM ci --include=dev
    - cd $DEPLOYPATH && $NPM run build
    - /usr/bin/touch $DEPLOYPATH/tmp/restart.txt
