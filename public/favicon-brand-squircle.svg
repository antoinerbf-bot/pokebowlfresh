<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dégradé Fond Écrin Café Torréfié #2C1D16 Signature PokeNBowl -->
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A271E"/>
      <stop offset="60%" stop-color="#2C1D16"/>
      <stop offset="100%" stop-color="#1A110D"/>
    </linearGradient>

    <!-- Dégradé Bordure Corail Poké -->
    <linearGradient id="coralRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A60"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Dégradé Céramique Blanche -->
    <linearGradient id="ceramicBowl2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2DBD0"/>
    </linearGradient>

    <!-- Saumon Lumineux -->
    <linearGradient id="salmonJuicy2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A60"/>
      <stop offset="100%" stop-color="#E1251B"/>
    </linearGradient>

    <!-- Avocat -->
    <linearGradient id="avoJuicy2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Mangue -->
    <linearGradient id="mangoJuicy2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Ombre sous le bol -->
    <filter id="innerBowlShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fond Squircle Élégant Signature PokeNBowl -->
  <rect width="64" height="64" rx="16" fill="url(#brandBg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#coralRim)" stroke-width="1.8" fill="none" opacity="0.9"/>

  <!-- Baguettes Bambou Doré -->
  <line x1="8" y1="18" x2="52" y2="46" stroke="#D4A373" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="14" y1="12" x2="56" y2="40" stroke="#FFE0B2" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Bol Blanc Céramique -->
  <circle cx="32" cy="32" r="22" fill="url(#ceramicBowl2)" filter="url(#innerBowlShadow)" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="19.5" fill="#FFFDF9"/>

  <!-- Quartier 1 : Saumon Rouge Corail Frais -->
  <path d="M 32 32 L 32 12.5 A 19.5 19.5 0 0 1 51.5 32 Z" fill="url(#salmonJuicy2)"/>
  <path d="M 36 15 Q 42 22 47 28" stroke="#FFE7E0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <rect x="40" y="16" width="6" height="6" rx="1.6" fill="#FFA18D"/>
  <rect x="35" y="22" width="5.5" height="5.5" rx="1.6" fill="#FF5033"/>

  <!-- Quartier 2 : Avocat Émincé -->
  <path d="M 32 32 L 12.5 32 A 19.5 19.5 0 0 1 32 12.5 Z" fill="#14532D"/>
  <path d="M 32 32 L 14 26 A 19.5 19.5 0 0 1 26 14 Z" fill="url(#avoJuicy2)"/>
  <path d="M 32 32 L 18 21 A 19.5 19.5 0 0 1 21 18 Z" fill="#DCFCE7"/>

  <!-- Quartier 3 : Mangue Tropicale -->
  <path d="M 32 32 L 12.5 32 A 19.5 19.5 0 0 0 32 51.5 Z" fill="url(#mangoJuicy2)"/>
  <rect x="17" y="36" width="6.5" height="6.5" rx="1.5" fill="#FEF08A"/>
  <rect x="23" y="41" width="6.5" height="6.5" rx="1.5" fill="#F59E0B"/>

  <!-- Quartier 4 : Edamames & Algues Wakamé -->
  <path d="M 32 32 L 32 51.5 A 19.5 19.5 0 0 0 51.5 32 Z" fill="#0F3820"/>
  <circle cx="40" cy="41" r="3.6" fill="#4ADE80"/>
  <circle cx="41" cy="39.5" r="1" fill="#BBF7D0"/>
  <circle cx="46" cy="36" r="3.2" fill="#22C55E"/>
  <circle cx="36" cy="36" r="2.8" fill="#86EFAC"/>

  <!-- Centre : Graines de Sésame -->
  <circle cx="32" cy="32" r="3.2" fill="#1E293B"/>
  <circle cx="29" cy="31" r="0.8" fill="#FFFFFF"/>
  <circle cx="35" cy="31" r="0.8" fill="#000000"/>
  <circle cx="31" cy="34" r="0.8" fill="#FFFFFF"/>
  <circle cx="33" cy="35" r="0.8" fill="#000000"/>
</svg>