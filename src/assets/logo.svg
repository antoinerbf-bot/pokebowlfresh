<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" fill="none">
  <!-- Matte black pill background with subtle glow and border -->
  <rect width="380" height="90" rx="20" fill="#10251F"/>
  <rect x="1" y="1" width="378" height="88" rx="19" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
  
  <!-- Text POKE -->
  <text x="36" y="56" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" letter-spacing="4.5">POKE</text>
  
  <!-- Circled N -->
  <circle cx="190" cy="45" r="23" stroke="#FFFFFF" stroke-width="3.5" fill="#10251F"/>
  <text x="190" y="55" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="900">N</text>
  
  <!-- Text BOWL -->
  <text x="234" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" letter-spacing="4.5">BOWL</text>
  
  <!-- Subtitle SUR MESURE -->
  <text x="235" y="69" fill="#D7FF45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="900" letter-spacing="3.5">SUR MESURE</text>
</svg>
